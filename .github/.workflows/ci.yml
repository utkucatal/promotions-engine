name: CI

# When should it run?
# On every push and every pull request
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest   # Runs on GitHub-hosted runner

    # Services: external dependencies required by tests
    # Think like docker-compose but in GitHub Actions syntax
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: promotions_test      # Test DB — separate from prod DB
          POSTGRES_USER: app
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        # Wait until Postgres is ready
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:8.4
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s

    steps:
      # 1. Checkout the code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup PHP
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, redis, mbstring, zip
          # coverage: xdebug  ← enable if you want coverage reports

      # 3. Composer cache — avoid reinstalling vendor every time
      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          # If composer.lock unchanged → use cache, else reinstall

      # 4. Install dependencies
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      # 5. Create .env for test environment
      - name: Create test .env
        run: |
          cp .env .env.test.local
          echo "DATABASE_URL=postgresql://app:secret@127.0.0.1:5432/promotions_test" >> .env.test.local
          echo "REDIS_URL=redis://127.0.0.1:6379" >> .env.test.local

      # 6. Prepare test database
      - name: Setup test database
        run: |
          php bin/console doctrine:database:create --env=test --if-not-exists
          php bin/console doctrine:migrations:migrate --env=test --no-interaction

      # 7. Run tests
      - name: Run tests
        run: php bin/phpunit

      # 8. (Optional) For test coverage badge
      # - name: Upload coverage
      #   uses: codecov/codecov-action@v4